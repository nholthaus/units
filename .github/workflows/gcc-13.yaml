name: g++-13

on:
  push:
    branches: [ '**' ]  # Run on all branches
    tags: [ 'v*' ]      # Run on release tags too
  pull_request:
    branches: [ '**' ]  # Run on all branches

jobs:
  build-ubuntu-gcc:
    name: Build on Ubuntu Latest with GCC-13
    runs-on: ubuntu-latest

    steps:
      - name: Set up Locales
        run: |
          sudo apt update
          sudo apt install -y locales
          sudo locale-gen de_DE.UTF-8 en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: Add GCC Toolchain PPA
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update

      - name: Install GCC-13
        run: |
          sudo apt install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 90

      - name: Install Eigen
        run: sudo apt install -y libeigen3-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure --parallel 4

      - name: Error-message tests
        run: |
          python3 test/errorMessages/run.py --cc g++-13 --std c++23 --include include --jobs 4

      - name: Reference tables up to date
        # The supported-units and constants tables in README.md and docs/reference are generated from the
        # headers; fail if a unit or constant was added/changed without regenerating them.
        run: |
          python3 docs/reference/gen_reference.py --check

      - name: builtin_dimensions in sync
        # visit()'s default candidate set (builtin_dimensions in serialization.h) is a hand-maintained list;
        # C++ cannot enumerate the dimension namespace header-only, so this fails the build if a dimension was
        # added to core.h without being listed (consuming the library needs nothing — this is a CI-only guard).
        run: |
          python3 scripts/check_builtin_dimensions.py

  undefined-behavior-sanitizer:
    name: UndefinedBehaviorSanitizer (GCC-13)
    runs-on: ubuntu-latest

    steps:
      - name: Add GCC Toolchain PPA
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update

      - name: Install GCC-13
        run: |
          sudo apt install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 90

      - name: Install Eigen
        run: sudo apt install -y libeigen3-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      # Build and run the suite under UBSan so any runtime undefined behavior (integer overflow in a conversion,
      # a bad cast, misaligned access) FAILS the build instead of silently returning a wrong value.
      # -fno-sanitize-recover makes the first UB abort with a non-zero exit; ctest then fails.
      - name: Configure CMake (UBSan)
        run: |
          cmake -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build (UBSan)
        run: cmake --build build-ubsan --parallel

      - name: Run tests under UBSan
        working-directory: build-ubsan
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --output-on-failure --parallel 4
