name: g++-13

on:
  push:
    branches: [ '**' ]  # Run on all branches
    tags: [ 'v*' ]      # Run on release tags too
  pull_request:
    branches: [ '**' ]  # Run on all branches

jobs:
  build-ubuntu-gcc:
    name: Build on Ubuntu Latest with GCC-13
    runs-on: ubuntu-latest

    steps:
      - name: Set up Locales
        run: |
          sudo apt update
          sudo apt install -y locales
          sudo locale-gen de_DE.UTF-8 en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: Add GCC Toolchain PPA
        run: |
          sudo apt install -y software-properties-common
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update

      - name: Install GCC-13
        run: |
          sudo apt install -y g++-13
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 90

      - name: Install Eigen
        run: sudo apt install -y libeigen3-dev

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure

      - name: Error-message tests
        run: |
          python3 test/errorMessages/run.py --cc g++-13 --std c++23 --include include

      - name: Reference tables up to date
        # The supported-units and constants tables in README.md and docs/reference are generated from the
        # headers; fail if a unit or constant was added/changed without regenerating them.
        run: |
          python3 docs/reference/gen_reference.py --check
