name: docs

on:
  push:
    branches: [ '**' ]      # build-and-check the docs on every branch; deploy only from main (below)
  pull_request:
    branches: [ '**' ]

# Least privilege by default; the deploy job widens to what GitHub Pages needs.
permissions:
  contents: read

# Never run two Pages deployments at once; let an in-flight deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install Doxygen and Graphviz
        # The apt Doxygen lags; install a current release so the modern Doxyfile is honored.
        uses: ssciwr/doxygen-install@v2

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Configure CMake
        # A pull request must not introduce a Doxygen warning; treat them as failures on PRs. The value is
        # read at configure time (it is substituted into the generated Doxyfile), so it is set here. The
        # documentation currently builds with zero warnings, so this gate is active.
        env:
          DOXYGEN_WARN_AS_ERROR: ${{ github.event_name == 'pull_request' && 'FAIL_ON_WARNINGS' || 'NO' }}
        run: cmake -B build -DUNITS_BUILD_DOCS=ON -DUNITS_BUILD_TESTS=OFF -DUNITS_BUILD_EXAMPLES=OFF

      - name: Build documentation
        run: cmake --build build --target doc

      - name: Upload Pages artifact
        # Only produce the artifact on the branch that can deploy (main).
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  deploy:
    name: Deploy to GitHub Pages
    # Publish only from the default branch — never from a feature branch, a PR, or a tag (the
    # github-pages environment permits deployments from main only).
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
